name: YouTube Playlists Notifier
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run notifier script
        env:
          WEBHOOK_TOP: ${{ secrets.WEBHOOK_TOP }}
          WEBHOOK_JUNGLE: ${{ secrets.WEBHOOK_JUNGLE }}
          WEBHOOK_MID: ${{ secrets.WEBHOOK_MID }}
          WEBHOOK_ADC: ${{ secrets.WEBHOOK_ADC }}
          WEBHOOK_SUPP: ${{ secrets.WEBHOOK_SUPP }}
          WEBHOOK_OVERALL: ${{ secrets.WEBHOOK_OVERALL }}
        run: python script.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_videos.json || true
          git commit -m "Update last video state" || exit 0
          git push
